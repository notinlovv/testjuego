<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego RPG Plataformas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
        }
        canvas {
            background-color: #ecf0f1;
            border: 4px solid #34495e;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <canvas id="juegoCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('juegoCanvas');
        const ctx = canvas.getContext('2d');

        // Propiedades del jugador
        const jugador = {
            x: 50,
            y: 300,
            ancho: 40,
            alto: 40,
            velocidadX: 0,
            velocidadY: 0,
            rapidez: 5,
            fuerzaSalto: 12,
            enSuelo: false
        };

        // Física
        const gravedad = 0.6;
        const friccion = 0.8;

        // Estado de las teclas
        const teclas = {
            w: false,
            a: false,
            s: false,
            d: false
        };

        // Escuchar cuando se presiona una tecla
        window.addEventListener('keydown', function(e) {
            const tecla = e.key.toLowerCase();
            if (teclas.hasOwnProperty(tecla)) {
                teclas[tecla] = true;
            }
        });

        // Escuchar cuando se suelta una tecla
        window.addEventListener('keyup', function(e) {
            const tecla = e.key.toLowerCase();
            if (teclas.hasOwnProperty(tecla)) {
                teclas[tecla] = false;
            }
        });

        // Función principal de actualización (Game Loop)
        function actualizar() {
            // 1. Aplicar movimiento horizontal (A y D)
            if (teclas.a) {
                jugador.velocidadX = -jugador.rapidez;
            } else if (teclas.d) {
                jugador.velocidadX = jugador.rapidez;
            } else {
                // Fricción para que no frene de golpe
                jugador.velocidadX *= friccion; 
            }

            // 2. Aplicar salto (W)
            if (teclas.w && jugador.enSuelo) {
                jugador.velocidadY = -jugador.fuerzaSalto;
                jugador.enSuelo = false;
            }

            // 3. Aplicar gravedad
            jugador.velocidadY += gravedad;

            // 4. Actualizar posiciones
            jugador.x += jugador.velocidadX;
            jugador.y += jugador.velocidadY;

            // 5. Colisión con el suelo (Límites del canvas)
            // El suelo será la parte inferior del canvas
            if (jugador.y + jugador.alto >= canvas.height) {
                jugador.y = canvas.height - jugador.alto; // Lo ajustamos al borde
                jugador.velocidadY = 0;                   // Detenemos la caída
                jugador.enSuelo = true;                   // Puede volver a saltar
            } else {
                jugador.enSuelo = false;
            }

            // Evitar que salga por los lados
            if (jugador.x < 0) jugador.x = 0;
            if (jugador.x + jugador.ancho > canvas.width) jugador.x = canvas.width - jugador.ancho;

            dibujar();
            
            // Volver a llamar a la función en el próximo frame
            requestAnimationFrame(actualizar);
        }

        // Función para dibujar los elementos en pantalla
        function dibujar() {
            // Limpiar el canvas en cada frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar al jugador (un cuadrado)
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(jugador.x, jugador.y, jugador.ancho, jugador.alto);
        }

        // Iniciar el juego
        actualizar();
    </script>
</body>
</html>
