<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RPG Plataformas - Fondo Infinito</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { 
            /* Para que el pixel art se vea nítido */
            image-rendering: pixelated; 
            border: 2px solid #fff; 
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // --- Configuración de pantalla ---
        canvas.width = 1280;
        canvas.height = 720;

        // Definimos un mundo muy ancho (4000px)
        const mundo = { ancho: 4000, alto: 720 };

        // --- Variables de Estado ---
        let assets_cargados = false;
        let background_pattern = null; // Aquí guardaremos el mosaico

        // --- PRECARGA DE ACTIVOS ---
        // Referencia a tu imagen: images/cielopixelart.jpg
        const background_img = new Image();
        background_img.src = 'images/cielopixelart.jpg';

        background_img.onload = () => {
            // Una vez cargada la imagen, creamos el patrón de mosaico
            background_pattern = ctx.createPattern(background_img, 'repeat');
            assets_cargados = true;
            // Iniciamos el bucle del juego solo cuando la imagen esté lista
            iniciarJuego();
        };

        // --- ENTIDADES Y FÍSICA (Base anterior) ---
        const jugador = {
            x: 200, y: 500, ancho: 50, alto: 50,
            velX: 0, velY: 0, rapidez: 7, salto: 15, enSuelo: false
        };

        const camara = { x: 0, y: 0 };
        const gravedad = 0.8;
        const friccion = 0.85;
        const teclas = {};

        const plataformas = [
            { x: 0, y: 650, w: 4000, h: 70 }, // Suelo muy largo
            { x: 400, y: 500, w: 200, h: 20 },
            { x: 800, y: 400, w: 200, h: 20 },
            { x: 1200, y: 300, w: 200, h: 20 },
            { x: 1600, y: 450, w: 300, h: 20 }
        ];

        window.onkeydown = (e) => teclas[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => teclas[e.key.toLowerCase()] = false;

        function actualizar() {
            // Movimiento
            if (teclas['a']) jugador.velX = -jugador.rapidez;
            else if (teclas['d']) jugador.velX = jugador.rapidez;
            else jugador.velX *= friccion;

            if (teclas['w'] && jugador.enSuelo) {
                jugador.velY = -jugador.salto;
                jugador.enSuelo = false;
            }

            // Gravedad
            jugador.velY += gravedad;
            jugador.x += jugador.velX;
            jugador.y += jugador.velY;

            // Colisiones con plataformas
            jugador.enSuelo = false;
            plataformas.forEach(p => {
                if (jugador.x < p.x + p.w && jugador.x + jugador.ancho > p.x &&
                    jugador.y + jugador.alto > p.y && jugador.y + jugador.alto < p.y + p.h + jugador.velY) {
                    jugador.y = p.y - jugador.alto;
                    jugador.velY = 0;
                    jugador.enSuelo = true;
                }
            });

            // Lógica de la Cámara (Suavizado y Límites)
            let objetivoX = jugador.x - canvas.width / 2 + jugador.ancho / 2;
            camara.x += (objetivoX - camara.x) * 0.1;

            if (camara.x < 0) camara.x = 0;
            if (camara.x > mundo.ancho - canvas.width) camara.x = mundo.ancho - canvas.width;
        }

        function dibujar() {
            // Primero, dibujamos el fondo de mosaico.
            // Para que el fondo se repita infinitamente con la cámara,
            // tenemos que desplazar la matriz de dibujo antes de pintar el patrón.
            
            ctx.save();
            // Desplazamos la matriz de dibujo del fondo con la cámara
            ctx.translate(-camara.x, -camara.y);
            // El patrón se creará y repetirá *dentro* de este rectángulo
            ctx.fillStyle = background_pattern;
            ctx.fillRect(0, 0, mundo.ancho, mundo.alto); // Rellenamos todo el mundo
            ctx.restore();

            // Dibujamos el resto del mundo (Plataformas, Jugador) con la cámara
            ctx.save();
            ctx.translate(-camara.x, 0); // Aplicamos el scroll de cámara

            // Dibujar Plataformas
            ctx.fillStyle = "#4a7c44";
            plataformas.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            // Dibujar Jugador
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(jugador.x, jugador.y, jugador.ancho, jugador.alto);

            ctx.restore();
        }

        // --- Bucle principal ---
        function bucle() {
            actualizar();
            dibujar();
            requestAnimationFrame(bucle);
        }

        function iniciarJuego() {
            bucle();
        }
    </script>
</body>
</html>
