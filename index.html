<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego RPG Plataformas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
        }
        canvas {
            background-color: #ecf0f1;
            border: 4px solid #34495e;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <canvas id="juegoCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('juegoCanvas');
        const ctx = canvas.getContext('2d');


        const jugador = {
            x: 50,
            y: 300,
            ancho: 40,
            alto: 40,
            velocidadX: 0,
            velocidadY: 0,
            rapidez: 5,
            fuerzaSalto: 12,
            enSuelo: false
        };


        const gravedad = 0.6;
        const friccion = 0.8;


        const teclas = {
            w: false,
            a: false,
            s: false,
            d: false
        };


        window.addEventListener('keydown', function(e) {
            const tecla = e.key.toLowerCase();
            if (teclas.hasOwnProperty(tecla)) {
                teclas[tecla] = true;
            }
        });

        window.addEventListener('keyup', function(e) {
            const tecla = e.key.toLowerCase();
            if (teclas.hasOwnProperty(tecla)) {
                teclas[tecla] = false;
            }
        });


        function actualizar() {

            if (teclas.a) {
                jugador.velocidadX = -jugador.rapidez;
            } else if (teclas.d) {
                jugador.velocidadX = jugador.rapidez;
            } else {

                jugador.velocidadX *= friccion; 
            }


            if (teclas.w && jugador.enSuelo) {
                jugador.velocidadY = -jugador.fuerzaSalto;
                jugador.enSuelo = false;
            }


            jugador.velocidadY += gravedad;


            jugador.x += jugador.velocidadX;
            jugador.y += jugador.velocidadY;


            if (jugador.y + jugador.alto >= canvas.height) {
                jugador.y = canvas.height - jugador.alto; 
                jugador.velocidadY = 0;                   
                jugador.enSuelo = true;                   
            } else {
                jugador.enSuelo = false;
            }

           
            if (jugador.x < 0) jugador.x = 0;
            if (jugador.x + jugador.ancho > canvas.width) jugador.x = canvas.width - jugador.ancho;

            dibujar();
            
           
            requestAnimationFrame(actualizar);
        }

       
        function dibujar() {
          
            ctx.clearRect(0, 0, canvas.width, canvas.height);

           
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(jugador.x, jugador.y, jugador.ancho, jugador.alto);
        }

        
        actualizar();
    </script>
</body>
</html>
