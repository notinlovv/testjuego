<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RPG Plataformas - Animación y Pinchos</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { 
            image-rendering: pixelated; 
            border: 2px solid #fff; 
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 1280;
        canvas.height = 720;
        const mundo = { ancho: 4000, alto: 720 };

        let assets_cargados = false;
        let background_pattern = null;

        const background_img = new Image();
        background_img.src = 'images/cielopixelart.jpg';
        background_img.onload = () => {
            background_pattern = ctx.createPattern(background_img, 'repeat');
            assets_cargados = true;
            iniciarJuego();
        };
        background_img.onerror = () => {
            console.error("No se pudo cargar el fondo, iniciando sin él.");
            iniciarJuego(); 
        };

        // --- PUNTO DE INICIO ---
        const inicioX = 100;
        const inicioY = 300;

        // --- JUGADOR ---
        // Velocidad reducida (antes 7, ahora 4.5)
        const jugador = {
            x: inicioX, y: inicioY, ancho: 40, alto: 50,
            velX: 0, velY: 0, rapidez: 4.5, salto: 13, enSuelo: false,
            estado: 'idle', // idle, run, jump
            dir: 1 // 1 derecha, -1 izquierda
        };

        const camara = { x: 0, y: 0 };
        const gravedad = 0.8;
        const friccion = 0.85;
        const teclas = {};
        let contadorFrames = 0; // Para medir el tiempo de las animaciones

        // --- PLATAFORMAS Y TRAMPAS ---
        const nivelPinchosY = 650; // A qué altura te mueres

        const plataformas = [
            { x: 50, y: 500, w: 300, h: 20 },  // Plataforma inicial
            { x: 450, y: 450, w: 200, h: 20 }, // Salto 1
            { x: 800, y: 400, w: 200, h: 20 }, // Salto 2
            { x: 1200, y: 300, w: 200, h: 20 },
            { x: 1600, y: 450, w: 300, h: 20 }
        ];

        // --- ANIMACIONES DEL STICKMAN PIXELADO ---
        // La X es un pixel rojo, el espacio vacío es transparente
        const animaciones = {
            idle: [
                ["  XXXX  ",
                 "  XXXX  ",
                 "   XX   ",
                 " XXXXXX ",
                 " X XX X ",
                 " X XX X ",
                 "   XX   ",
                 "  XXXX  ",
                 "  X  X  ",
                 " XX  XX "]
            ],
            run: [
                ["  XXXX  ",
                 "  XXXX  ",
                 "   XX   ",
                 "  XXXX  ",
                 " X XX   ",
                 "   XX X ",
                 "   XX   ",
                 "  XXXX  ",
                 "  X  X  ",
                 " XX   X "],
                ["  XXXX  ",
                 "  XXXX  ",
                 "   XX   ",
                 "  XXXX  ",
                 "   XX X ",
                 " X XX   ",
                 "   XX   ",
                 "  XXXX  ",
                 "  X  X  ",
                 "  X   XX"]
            ],
            jump: [
                ["  XXXX  ",
                 "  XXXX  ",
                 " X XX X ",
                 " XXXXXX ",
                 "   XX   ",
                 "   XX   ",
                 "   XX   ",
                 "  XXXX  ",
                 "  X  X  ",
                 " XX  XX "]
            ]
        };

        window.onkeydown = (e) => teclas[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => teclas[e.key.toLowerCase()] = false;

        function morir() {
            // Reiniciamos al jugador a su posición original
            jugador.x = inicioX;
            jugador.y = inicioY;
            jugador.velX = 0;
            jugador.velY = 0;
        }

        function actualizar() {
            contadorFrames++;

            // Movimiento
            if (teclas['a']) jugador.velX = -jugador.rapidez;
            else if (teclas['d']) jugador.velX = jugador.rapidez;
            else jugador.velX *= friccion;

            if (teclas['w'] && jugador.enSuelo) {
                jugador.velY = -jugador.salto;
                jugador.enSuelo = false;
            }

            jugador.velY += gravedad;
            jugador.x += jugador.velX;
            jugador.y += jugador.velY;

            // Determinar dirección (para voltear el dibujo)
            if (jugador.velX > 0.5) jugador.dir = 1;
            if (jugador.velX < -0.5) jugador.dir = -1;

            // Colisiones con plataformas
            jugador.enSuelo = false;
            plataformas.forEach(p => {
                if (jugador.x < p.x + p.w && jugador.x + jugador.ancho > p.x &&
                    jugador.y + jugador.alto > p.y && jugador.y + jugador.alto < p.y + p.h + jugador.velY) {
                    jugador.y = p.y - jugador.alto;
                    jugador.velY = 0;
                    jugador.enSuelo = true;
                }
            });

            // Lógica de Muerte (Caer a los pinchos)
            if (jugador.y + jugador.alto >= nivelPinchosY) {
                morir();
            }

            // Evitar que salga por la izquierda del mundo
            if (jugador.x < 0) jugador.x = 0;

            // Determinar el estado de animación
            if (!jugador.enSuelo) {
                jugador.estado = 'jump';
            } else if (Math.abs(jugador.velX) > 1) {
                jugador.estado = 'run';
            } else {
                jugador.estado = 'idle';
            }

            // Cámara
            let objetivoX = jugador.x - canvas.width / 2 + jugador.ancho / 2;
            camara.x += (objetivoX - camara.x) * 0.1;
            if (camara.x < 0) camara.x = 0;
            if (camara.x > mundo.ancho - canvas.width) camara.x = mundo.ancho - canvas.width;
        }

        function dibujarStickman() {
            let framesActuales = animaciones[jugador.estado];
            let frameIndex = 0;
            
            // Si está corriendo, alternamos entre los 2 frames de correr cada 10 ciclos
            if (jugador.estado === 'run') {
                frameIndex = Math.floor(contadorFrames / 10) % framesActuales.length;
            }
            let matriz = framesActuales[frameIndex];

            ctx.save();
            // Movemos el origen al centro del jugador para poder voltearlo
            ctx.translate(jugador.x + jugador.ancho / 2, jugador.y + jugador.alto / 2);
            ctx.scale(jugador.dir, 1); // 1 = derecha, -1 = efecto espejo a la izquierda
            
            let tamPixel = 5; // Cada "pixel" en la matriz medirá 5x5 pixeles reales
            ctx.fillStyle = '#e74c3c'; // Rojo
            
            for (let fila = 0; fila < matriz.length; fila++) {
                for (let col = 0; col < matriz[fila].length; col++) {
                    if (matriz[fila][col] === 'X') {
                        // Dibujamos el cuadradito, restando la mitad para mantenerlo centrado
                        ctx.fillRect((col - 4) * tamPixel, (fila - 5) * tamPixel, tamPixel, tamPixel);
                    }
                }
            }
            ctx.restore();
        }

        function dibujarPinchos() {
            ctx.fillStyle = '#7f8c8d'; // Gris metálico
            ctx.beginPath();
            for (let i = 0; i < mundo.ancho; i += 20) {
                ctx.moveTo(i, nivelPinchosY + 40); // Base izquierda
                ctx.lineTo(i + 10, nivelPinchosY); // Punta arriba
                ctx.lineTo(i + 20, nivelPinchosY + 40); // Base derecha
            }
            ctx.fill();
            
            // Zona oscura debajo de los pinchos
            ctx.fillStyle = '#111';
            ctx.fillRect(0, nivelPinchosY + 40, mundo.ancho, mundo.alto - nivelPinchosY);
        }

        function dibujar() {
            ctx.save();
            ctx.translate(-camara.x, -camara.y);
            if (background_pattern) {
                ctx.fillStyle = background_pattern;
                ctx.fillRect(0, 0, mundo.ancho, mundo.alto);
            } else {
                // Color de respaldo por si la imagen falla
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(0, 0, mundo.ancho, mundo.alto);
            }
            ctx.restore();

            ctx.save();
            ctx.translate(-camara.x, 0);

            // Dibujar Plataformas
            ctx.fillStyle = "#4a7c44";
            plataformas.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            dibujarPinchos();
            dibujarStickman();

            ctx.restore();
        }

        function bucle() {
            actualizar();
            dibujar();
            requestAnimationFrame(bucle);
        }

        function iniciarJuego() {
            bucle();
        }
    </script>
</body>
</html>
